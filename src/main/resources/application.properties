spring.application.name=3-spring-api

# --- Servidor ---
# Render (y otras plataformas) asignan el puerto en la variable PORT; en local, 8080.
server.port=${PORT:8080}

# --- Variables de entorno locales ---
# Carga el archivo .env de la raíz del proyecto si existe (no se sube a git).
spring.config.import=optional:file:.env[.properties]

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# --- Errores ---
spring.mvc.problemdetails.enabled=true

# --- Content negotiation ---
# Además de la cabecera Accept, el formato se puede pedir con ?format=json|xml|csv|xlsx|pdf
# (útil para descargar desde el navegador). Sin preferencia (Accept */*), se responde JSON.
spring.mvc.contentnegotiation.favor-parameter=true
spring.mvc.contentnegotiation.parameter-name=format
spring.mvc.contentnegotiation.media-types.json=application/json
spring.mvc.contentnegotiation.media-types.xml=application/xml
spring.mvc.contentnegotiation.media-types.csv=text/csv
spring.mvc.contentnegotiation.media-types.xlsx=application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
spring.mvc.contentnegotiation.media-types.pdf=application/pdf
spring.mvc.contentnegotiation.default-content-types=application/json

# --- Paginación de los listados JSON (?page=&size=&sort=) ---
# size por defecto 10; un size mayor a 100 se recorta a 100 sin error.
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# --- PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spring_api}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA / Hibernate ---
# update es cómodo en desarrollo; en producción usar validate + migraciones (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Seed de datos (src/main/resources/data.sql) ---
# Ejecuta data.sql también en PostgreSQL (por defecto solo en bases embebidas),
# después de que Hibernate crea las tablas.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# --- Seguridad: JWT en cookies HttpOnly ---
# Clave HMAC en Base64 (mínimo 256 bits). Sin valor por defecto: la app no arranca sin JWT_SECRET.
# Genera una con: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=3-spring-api
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d
# Secure=true exige HTTPS (los navegadores aceptan http://localhost); false para Postman/curl en http local.
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

# --- Administrador inicial ---
# Se crea al arrancar si no existe un usuario con ese email. Sin ADMIN_PASSWORD no se crea.
app.admin.email=${ADMIN_EMAIL:admin@ejemplo.com}
app.admin.password=${ADMIN_PASSWORD:}

# Swagger UI lee la cookie XSRF-TOKEN y la envía en la cabecera X-XSRF-TOKEN.
springdoc.swagger-ui.csrf.enabled=true
