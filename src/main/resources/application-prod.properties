# Perfil "prod": se activa con SPRING_PROFILES_ACTIVE=prod (Render, Docker contra Supabase).
# Solo sobrescribe lo que cambia respecto de application.properties (desarrollo).
# Lo que depende del entorno (credenciales, URL, puerto) sigue llegando por variables de entorno.

# --- PostgreSQL ---
# Sin valores por defecto: si falta una variable, la app no arranca (nada de localhost ni postgres/postgres).
# Sin DB_URL, Spring deja el texto "${DB_URL}" tal cual y el error es: 'url' must start with "jdbc".
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Pocas conexiones: el Session pooler de Supabase (plan gratis) y la instancia de Render son pequeños.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# --- JPA / Hibernate ---
# validate: Hibernate comprueba que el esquema coincide con las entities, pero nunca lo modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Seed ---
# data.sql (los 20 clientes de ejemplo) no se ejecuta en producción.
spring.sql.init.mode=never

# --- OpenAPI / Swagger UI ---
# El contrato de la API no queda público en producción.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Proxy con HTTPS delante (Render, y Vercel con su rewrite) ---
# Respeta X-Forwarded-Proto / X-Forwarded-Host: la petición original llegó por HTTPS.
server.forward-headers-strategy=framework
